<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="localCardGrad" x1="20" y1="20" x2="620" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hostCardGrad" x1="660" y1="20" x2="940" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="prismAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Container: 100% Local On-Device Boundary -->
  <rect x="24" y="24" width="600" height="432" rx="12" fill="url(#localCardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="36" y="34" width="280" height="26" rx="6" fill="#0369A1" fill-opacity="0.25"/>
  <text x="46" y="52" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">🔒 100% LOCAL ON-DEVICE BOUNDARY</text>
  <text x="326" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">(Zero External Network Calls • No Telemetry)</text>

  <!-- User Prompt Input Box -->
  <rect x="44" y="74" width="220" height="64" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="56" y="94" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">👤 DEVELOPER PROMPT</text>
  <text x="56" y="112" fill="#F8FAFC" font-family="'SF Mono', Menlo, monospace" font-size="11">"@refract fix that error"</text>
  <text x="56" y="127" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Cmd+Alt+P / Chat Participant</text>

  <!-- Live VS Code State Box -->
  <rect x="44" y="154" width="220" height="96" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="56" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">💻 LIVE VS CODE SIGNALS</text>
  <text x="56" y="193" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Active Editor &amp; Saves</text>
  <text x="56" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Problems Diagnostics</text>
  <text x="56" y="227" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Terminal Exit Codes &amp; History</text>

  <!-- Arrows to Engine -->
  <path d="M 264 106 L 314 150" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 264 202 L 314 170" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Core Refract Engine Box -->
  <rect x="314" y="90" width="280" height="130" rx="10" fill="#0F172A" stroke="url(#prismAccent)" stroke-width="2" filter="url(#glow)"/>
  <text x="328" y="116" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">💠 Refract Trajectory Engine</text>
  <text x="328" y="134" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">&lt;2ms In-Memory Execution • Pure Node.js</text>
  <text x="328" y="156" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✓ Deictic Pronoun Binding ("that error" → file:line)</text>
  <text x="328" y="173" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✓ Vibe-Coding Failure Spiral Detector</text>
  <text x="328" y="190" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✓ 5-Dimension Trajectory Rubric Scoring</text>
  <text x="328" y="207" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✓ Pre-Flight Architectural Fork Check</text>

  <!-- Decision Branch -->
  <path d="M 454 220 L 454 256" stroke="#818CF8" stroke-width="2"/>
  <rect x="374" y="256" width="160" height="34" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="454" y="277" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Score ≥ 72 / Spiral / Fork?</text>

  <!-- Fork branches -->
  <!-- Branch 1: Pass through -->
  <path d="M 374 273 L 310 273 L 310 330" stroke="#10B981" stroke-width="1.5" fill="none"/>
  <rect x="234" y="330" width="150" height="54" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1"/>
  <text x="246" y="350" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🟢 Pass-Through</text>
  <text x="246" y="368" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Untouched prompt (&lt;0.1ms)</text>

  <!-- Branch 2: 3 Refracted Spectrums -->
  <path d="M 534 273 L 570 273 L 570 300" stroke="#818CF8" stroke-width="1.5" fill="none"/>
  <rect x="410" y="300" width="200" height="136" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
  <text x="422" y="322" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">💠 3 REFRACTED SPECTRUMS</text>
  
  <rect x="420" y="332" width="180" height="26" rx="4" fill="#78350F" fill-opacity="0.4" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="430" y="349" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">⚡ Precision (Context-Bound)</text>

  <rect x="420" y="364" width="180" height="26" rx="4" fill="#164E63" fill-opacity="0.4" stroke="#06B6D4" stroke-width="0.8"/>
  <text x="430" y="381" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">🔬 Root-Cause (Hypothesis 1st)</text>

  <rect x="420" y="396" width="180" height="26" rx="4" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="0.8"/>
  <text x="430" y="413" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">🛡️ Strict Spec (TDD &amp; Verified)</text>

  <!-- Output Connecting Lines to Right Container -->
  <path d="M 310 384 L 310 405 L 660 405" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 610 368 L 660 368" stroke="#818CF8" stroke-width="2" fill="none"/>

  <!-- Right Container: Host VS Code Session -->
  <rect x="648" y="24" width="288" height="432" rx="12" fill="url(#hostCardGrad)" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="664" y="34" width="256" height="26" rx="6" fill="#4338CA" fill-opacity="0.3"/>
  <text x="674" y="52" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">🧠 HOST VS CODE SESSION</text>

  <!-- Host Model Box -->
  <rect x="668" y="74" width="248" height="150" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
  <text x="682" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Your Active VS Code Model</text>
  <text x="682" y="118" fill="#A5B4FC" font-family="'SF Mono', Menlo, monospace" font-size="11">vscode.lm API</text>
  <text x="682" y="142" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• GitHub Copilot Chat (GPT-4o / Claude)</text>
  <text x="682" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Gemini / Copilot Agent Mode</text>
  <text x="682" y="178" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Custom Language Model Providers</text>
  <text x="682" y="204" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✓ Uses your existing chat subscription</text>

  <!-- Actions Box -->
  <rect x="668" y="244" width="248" height="192" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="682" y="268" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Execution Surfaces in VS Code</text>
  
  <text x="682" y="294" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">1. @refract Chat Participant</text>
  <text x="696" y="310" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Streams response with collapsible header</text>

  <text x="682" y="332" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">2. #refract Language Model Tool</text>
  <text x="696" y="348" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Referenced by Agent Mode inside any chat</text>

  <text x="682" y="370" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">3. Interactive Scorecard Webview</text>
  <text x="696" y="386" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Cmd+Alt+Shift+P side panel with 1-click runs</text>

  <text x="682" y="408" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">4. Cmd+Alt+P QuickPick</text>
  <text x="696" y="424" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Instant spectrum picker anywhere in editor</text>
</svg>
